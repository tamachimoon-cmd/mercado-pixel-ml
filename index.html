<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mercado Pixel + Produtos ML</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0e0e1a; font-family: 'Segoe UI', system-ui, sans-serif; color: #eee; }
  #loja-wrap { background: #111122; padding: 16px 0 8px; text-align: center; border-bottom: 4px solid #2a2a40; }
  #loja-wrap h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 3px; color: #ffd966; }
  canvas { border: 4px solid #2a2a40; image-rendering: pixelated; background: #1a1a2c; max-width: 100%; height: auto; }
  #produtos { padding: 24px 16px 40px; max-width: 1200px; margin: 0 auto; }
  #produtos h2 { margin: 0 0 6px; font-size: 20px; color: #ffd966; }
  #produtos .sub { margin: 0 0 20px; font-size: 13px; opacity: 0.7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .card { background: #1e1e32; border: 1px solid #2a2a44; border-radius: 10px; overflow: hidden; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-3px); border-color: #ffd966; }
  .card img { width: 100%; height: 160px; object-fit: cover; background: #2a2a40; display: block; }
  .card .info { padding: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 13.5px; line-height: 1.35; min-height: 36px; }
  .card a { display: inline-block; background: #ffe600; color: #111; text-decoration: none; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 6px; }
  .card a:hover { background: #ffd200; }
</style>
</head>
<body>
<div id="loja-wrap">
  <h1>MERCADO PIXEL</h1>
  <canvas id="c" width="880" height="380"></canvas>
</div>
<section id="produtos">
  <h2>Produtos em Destaque — Mercado Livre</h2>
  <p class="sub">Ofertas que estou divulgando</p>
  <div id="grid" class="grid"></div>
</section>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const TILE = 16; const COLS = 55; const ROWS = 24;
const map = Array.from({length: ROWS}, () => Array(COLS).fill(0));
for (let x = 0; x < COLS; x++) { map[0][x] = 1; map[ROWS-1][x] = 1; }
for (let y = 0; y < ROWS; y++) { map[y][0] = 1; map[y][COLS-1] = 1; }
for (let x = 5; x < 22; x++) map[4][x] = 2;
for (let x = 30; x < 48; x++) map[4][x] = 2;
for (let x = 5; x < 18; x++) map[9][x] = 2;
for (let x = 32; x < 46; x++) map[9][x] = 2;
for (let y = 5; y < 11; y++) map[y][25] = 2;
for (let x = 18; x < 34; x++) map[16][x] = 3;
map[17][24] = 4; map[17][25] = 4;
for (let y = 5; y < 12; y++) { map[y][3] = 5; map[y][51] = 5; }
[[3,10],[3,42],[14,8],[14,44]].forEach(([y,x]) => map[y][x] = 6);
map[12][10] = 7; map[12][40] = 7;
function drawMap() {
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const px = x * TILE, py = y * TILE, t = map[y][x];
      if (t === 0) { ctx.fillStyle = ((x + y) % 2 === 0) ? '#3c3c54' : '#36364e'; ctx.fillRect(px, py, TILE, TILE); }
      if (t === 1) { ctx.fillStyle = '#26263a'; ctx.fillRect(px, py, TILE, TILE); ctx.fillStyle = '#3a3a52'; ctx.fillRect(px, py, TILE, 4); }
      if (t === 2) { ctx.fillStyle = '#5a3e22'; ctx.fillRect(px, py + 5, TILE, 11); ctx.fillStyle = '#8b6b3a'; ctx.fillRect(px + 1, py + 1, TILE - 2, 6); const prods = ['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6']; for (let i = 0; i < 3; i++) { ctx.fillStyle = prods[(x + i) % prods.length]; ctx.fillRect(px + 2 + i * 4, py + 2, 3, 5); } }
      if (t === 3) { ctx.fillStyle = '#4a2e1a'; ctx.fillRect(px, py + 3, TILE, 13); ctx.fillStyle = '#c4a574'; ctx.fillRect(px + 1, py, TILE - 2, 6); }
      if (t === 4) { ctx.fillStyle = '#3a3a3a'; ctx.fillRect(px + 1, py + 1, 14, 12); ctx.fillStyle = '#2ecc71'; ctx.fillRect(px + 3, py + 3, 10, 5); }
      if (t === 5) { ctx.fillStyle = '#3a7ab0'; ctx.fillRect(px, py, TILE, TILE); ctx.fillStyle = '#5a9ad0'; ctx.fillRect(px + 2, py + 2, TILE - 4, TILE - 7); ctx.fillStyle = '#fff'; ctx.fillRect(px + 11, py + 5, 2, 7); }
      if (t === 6) { ctx.fillStyle = '#6a4a2a'; ctx.fillRect(px + 4, py + 10, 8, 6); ctx.fillStyle = '#27ae60'; ctx.fillRect(px + 2, py + 3, 12, 9); }
      if (t === 7) { ctx.fillStyle = '#c4a070'; ctx.fillRect(px + 2, py + 4, 12, 10); }
    }
  }
  ctx.fillStyle = '#2a1a10'; ctx.fillRect(24 * TILE, 0, 7 * TILE, TILE);
  ctx.fillStyle = '#5a4a3a'; ctx.fillRect(25 * TILE, 2, 5 * TILE, TILE - 4);
  ctx.fillStyle = '#c0392b'; ctx.fillRect(26 * TILE, TILE + 2, 3 * TILE, 12);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px monospace'; ctx.fillText('OPEN', 26 * TILE + 4, TILE + 11);
}
function drawCart(x, y) { ctx.fillStyle = '#b0b0b0'; ctx.fillRect(x, y + 6, 20, 10); ctx.fillStyle = '#909090'; ctx.fillRect(x + 7, y, 6, 8); ctx.fillStyle = '#333'; ctx.fillRect(x + 2, y + 14, 4, 3); ctx.fillRect(x + 14, y + 14, 4, 3); }
class Character {
  constructor(x, y, skin, hair, shirt, hasCart = false) { this.x = x; this.y = y; this.skin = skin; this.hair = hair; this.shirt = shirt; this.hasCart = hasCart; this.dir = Math.floor(Math.random() * 4); this.frame = 0; this.timer = 0; this.speed = 0.6 + Math.random() * 0.35; this.state = 'walk'; this.idleTimer = 0; }
  isWalkable(nx, ny) { const tx = Math.floor(nx / TILE); const ty = Math.floor(ny / TILE); if (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) return false; return map[ty][tx] === 0; }
  update() {
    this.timer++; if (this.timer > 7) { this.frame = (this.frame + 1) % 4; this.timer = 0; }
    if (this.state === 'idle') { this.idleTimer--; if (this.idleTimer <= 0) { this.state = 'walk'; this.dir = Math.floor(Math.random() * 4); } return; }
    let dx = 0, dy = 0; if (this.dir === 0) dy = this.speed; if (this.dir === 1) dx = -this.speed; if (this.dir === 2) dx = this.speed; if (this.dir === 3) dy = -this.speed;
    const nx = this.x + dx, ny = this.y + dy; const extra = this.hasCart ? 5 : 0;
    if (this.isWalkable(nx + 3, ny + 10) && this.isWalkable(nx + 12 + extra, ny + 14)) { this.x = nx; this.y = ny; } else { this.dir = Math.floor(Math.random() * 4); if (Math.random() < 0.2) { this.state = 'idle'; this.idleTimer = 40 + Math.random() * 60; } }
    if (Math.random() < 0.004) { this.state = 'idle'; this.idleTimer = 30 + Math.random() * 50; }
  }
  draw() {
    const px = Math.floor(this.x), py = Math.floor(this.y); const walk = this.state === 'walk' && this.frame % 2 === 0;
    if (this.hasCart) { let cx = px, cy = py + 10; if (this.dir === 0) cy = py + 14; if (this.dir === 1) cx = px - 16; if (this.dir === 2) cx = px + 14; if (this.dir === 3) cy = py - 4; drawCart(cx, cy); }
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(px + 3, py + 14, 10, 3);
    ctx.fillStyle = '#2c3e50'; ctx.fillRect(px + 4, py + 12, 3, 4); ctx.fillRect(px + 9, py + 12, 3, 4);
    if (walk) { ctx.fillRect(px + 4, py + 13, 3, 1); ctx.fillRect(px + 9, py + 11, 3, 1); }
    ctx.fillStyle = this.shirt; ctx.fillRect(px + 3, py + 7, 10, 6);
    ctx.fillStyle = this.skin; ctx.fillRect(px + 4, py + 1, 8, 7);
    ctx.fillStyle = this.hair; ctx.fillRect(px + 4, py, 8, 3);
    ctx.fillStyle = '#111';
    if (this.dir === 0) { ctx.fillRect(px + 5, py + 4, 2, 2); ctx.fillRect(px + 9, py + 4, 2, 2); } else if (this.dir === 1) ctx.fillRect(px + 5, py + 4, 2, 2); else if (this.dir === 2) ctx.fillRect(px + 9, py + 4, 2, 2);
  }
}
const skins = ['#f5cba7','#e0ac69','#c68642','#8d5524','#ffdbac'];
const hairs = ['#2c1e12','#5a3a1a','#d4a017','#1a1a1a','#8b4513'];
const shirts = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c'];
const chars = [];
function addChar(x, y, hasCart = false) { chars.push(new Character(x, y, skins[Math.floor(Math.random()*skins.length)], hairs[Math.floor(Math.random()*hairs.length)], shirts[Math.floor(Math.random()*shirts.length)], hasCart)); }
addChar(120, 140, true); addChar(300, 180, false); addChar(480, 130, true); addChar(650, 200, false); addChar(200, 250, true); addChar(550, 160, false);
canvas.addEventListener('click', (e) => { const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height; const x = (e.clientX - rect.left) * scaleX - 8; const y = (e.clientY - rect.top) * scaleY - 10; addChar(x, y, Math.random() < 0.35); });
function loopLoja() { ctx.clearRect(0, 0, canvas.width, canvas.height); drawMap(); chars.forEach(c => c.update()); chars.sort((a,b) => a.y - b.y); chars.forEach(c => c.draw()); requestAnimationFrame(loopLoja); }
loopLoja();
const produtos = [
  { nome: 'Access Point Huawei eKit AP361 Wi-Fi 6 AX1800', link: 'https://meli.la/1B7fR2e', img: 'covers/ap-huawei.jpg' },
  { nome: 'Access Point TP-Link EAP650 Wi-Fi 6 AX3000', link: 'https://meli.la/1sJKtsB', img: 'covers/ap-tplink.jpg' },
  { nome: 'Bota Adventure Caterpillar Couro', link: 'https://meli.la/274eRpJ', img: 'covers/bota-cat.jpg' },
  { nome: 'Bota Botina Couro Masculino Marrom', link: 'https://meli.la/1tv1m8V', img: 'covers/bota-botina.jpg' },
  { nome: 'Jean Paul Gaultier Le Beau 125ml', link: 'https://meli.la/1W7oyqG', img: 'covers/perfume-jpg.jpg' },
  { nome: 'Notebook HP ZBook Firefly i5 16GB 256GB', link: 'https://meli.la/22EzTo5', img: 'covers/notebook-hp.jpg' },
  { nome: 'Tênis Olympikus Corre Turbo Unissex', link: 'https://meli.la/1uEQyws', img: 'covers/tenis-olympikus.jpg' },
  { nome: 'Calça Jogger Cargo Masculina Sarja', link: '#', img: 'covers/calca-cargo.jpg' },
  { nome: 'Camiseta Oversized Streetwear', link: '#', img: 'covers/camiseta.jpg' },
  { nome: 'Mochila Viagem Impermeável Notebook', link: '#', img: 'covers/mochila.jpg' },
  { nome: 'Guarda-Chuva Automático Reforçado', link: '#', img: 'covers/guarda-chuva.jpg' },
  { nome: 'Jogo Tabuleiro Suspeito', link: '#', img: 'covers/jogo-suspeito.jpg' }
];
const grid = document.getElementById('grid');
grid.innerHTML = produtos.map(p => '<div class="card"><img src="'+p.img+'" alt="'+p.nome+'"><div class="info"><h3>'+p.nome+'</h3><a href="'+p.link+'" target="_blank" rel="noopener">Ver no Mercado Livre</a></div></div>').join('');
</script>
</body>
</html>
